# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Render builds the Dockerfile and asks for the values marked "sync: false".
# The database lives on Neon (free), not on Render.
services:
  - type: web
    name: queueless
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Paste the Java connection string from Neon (Connect -> Java, pooling off).
      - key: DATABASE_URL
        sync: false
      # Creates the two demo organizations and demo logins.
      - key: QUEUELESS_SEED_DEMO_DATA
        value: "true"
      # Password for all demo logins; choose your own.
      - key: QUEUELESS_SEED_PASSWORD
        sync: false
