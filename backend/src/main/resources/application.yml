# Common, production-safe defaults. Profiles:
#   dev  - local development (application-dev.yml)
#   prod - hosted deployment (application-prod.yml)
#   test - integration tests (src/test/resources/application-test.yml)
spring:
  application:
    name: queueless
  datasource:
    # DATABASE_URL may be a JDBC URL (jdbc:postgresql://host/db?sslmode=require)
    # or a provider URL with embedded credentials (postgresql://user:pass@host/db);
    # see DatabaseUrlEnvironmentPostProcessor.
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      pool-name: queueless-db
      maximum-pool-size: 10
      # Fail fast instead of waiting forever for a queue lock held by another request.
      connection-init-sql: "SET lock_timeout = '5s'"
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    # No hibernate.jdbc.time_zone override: Instants map to timestamptz (always UTC), while
    # LocalDate/LocalTime are organization-local calendar values that must be stored verbatim.
    # (Forcing UTC here shifted LocalTime values by the JVM's offset; see MigrationAndConstraintsIT.)
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 8h
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  transaction:
    default-timeout: 15s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        name: QUEUELESS_SESSION
        http-only: true
        same-site: lax
        secure: true
  tomcat:
    threads:
      max: 50
      min-spare: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        # Liveness never touches the database (used by the hosting platform so that
        # health checks do not keep a scale-to-zero database awake).
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

# API documentation is public on purpose: it describes endpoints, never data, and every
# endpoint enforces its own authorization. Set QUEUELESS_API_DOCS_ENABLED=false to hide it.
springdoc:
  api-docs:
    enabled: ${QUEUELESS_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${QUEUELESS_API_DOCS_ENABLED:true}
    path: /swagger-ui.html
  packages-to-scan: com.queueless

queueless:
  booking:
    max-days-ahead: 14
  check-in:
    early-minutes: 60
  notifications:
    approach-position: 3
  estimation:
    sample-size: 20
    min-samples: 3
  realtime:
    emitter-timeout: 30m
    heartbeat-interval: 20s
    reconnect-delay: 3s
    max-connections-per-user: 10
  security:
    https-redirect: false
    login:
      max-failures-per-email: 5
      max-failures-per-ip: 20
      window: 15m
      lockout: 15m
    registration:
      max-per-ip: 10
      window: 1h
  seed:
    enabled: false
    sample-tickets: false
    password: ""

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
