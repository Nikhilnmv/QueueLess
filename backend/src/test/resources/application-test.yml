# Integration tests run against a real PostgreSQL database (locking behaviour,
# partial unique indexes and generated columns are PostgreSQL features).
# Defaults match scripts/local-postgres.sh; another database can be used through the
# QUEUELESS_TEST_DATABASE_* environment variables.
spring:
  datasource:
    url: ${QUEUELESS_TEST_DATABASE_URL:jdbc:postgresql://localhost:5433/queueless_test}
    username: ${QUEUELESS_TEST_DATABASE_USERNAME:queueless}
    password: ${QUEUELESS_TEST_DATABASE_PASSWORD:queueless}
    hikari:
      # Concurrency tests run many transactions at the same time.
      maximum-pool-size: 40
  flyway:
    # Tests rebuild the schema from the migrations on every run (see TestFlywayConfig).
    clean-disabled: false

server:
  servlet:
    session:
      cookie:
        secure: false

queueless:
  seed:
    enabled: false
  realtime:
    heartbeat-interval: 2s
  security:
    # Every test request comes from 127.0.0.1 while the test clock stands still, so the per-IP
    # limits are raised here; they are covered by AttemptLimiterTest. The per-email login
    # lockout keeps its production value and is tested over HTTP in AuthIT.
    login:
      max-failures-per-ip: 100000
    registration:
      max-per-ip: 100000

logging:
  level:
    com.queueless: INFO
    org.springframework.security: WARN
