name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit, integration and concurrency tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: queueless
          POSTGRES_PASSWORD: queueless
          POSTGRES_DB: queueless_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U queueless -d queueless_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: backend
        env:
          QUEUELESS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5433/queueless_test
          QUEUELESS_TEST_DATABASE_USERNAME: queueless
          QUEUELESS_TEST_DATABASE_PASSWORD: queueless
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend type check and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  e2e:
    name: End-to-end tests (Playwright against the packaged app)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: queueless
          POSTGRES_PASSWORD: queueless
          POSTGRES_DB: queueless
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U queueless -d queueless"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend and package the application
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          (cd backend && ./mvnw -B -DskipTests package)
      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: queueless:ci
